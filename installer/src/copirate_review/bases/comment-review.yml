# A BASE workflow: a complete, runnable GitHub Actions workflow, and the source
# `copirate-review install` renders each repository's copy from. Run it as-is and it
# reviews a pull request WHEN SOMEONE ASKS — by commenting `/review` on it. Nothing in
# this file is a placeholder.
#
# The installer parses this file into typed objects, rebinds the step whose `id` is
# `review` — its `uses:` ref and its entire `with:` block, from the merged
# configuration — and writes the result. Everything else here is carried through
# unchanged, so this file is where the SHAPE of a rendered workflow is decided:
# triggers, permissions, concurrency, the gate, the checkout, the transcript upload.
#
# The `with:` block below is therefore illustrative, not a defaults table. It is
# REPLACED wholesale, so a value added here reaches no repository — the one home of a
# rendered workflow's inputs and secrets is the configuration.
# [LAW:one-source-of-truth]
#
# A repository ships its own shape by dropping `<name>.yml` in
# `.copirate-review/bases/`, or a machine does for every repo on it in
# `~/.config/copirate-review/bases/`. Neither forks the installer.
#
# WHY ON DEMAND AND NOT ON EVERY PUSH — the measurement this base exists because of.
# The `pr-review` base reviews every push and cancels the in-flight review when the next
# one lands. On a PR pushed to at a normal working pace that cancel is not an edge case,
# it is the common outcome: measured on promptctl/links-issue-tracker#557, pushes arrived
# 51 s to 5 m apart while reviews took 5-9 min, so 4 of 5 runs were SIGINT-killed
# mid-flight. Each killed run had already spent millions of tokens and posted no review —
# it billed a full review and delivered a `REVIEW DID NOT FINISH` notice instead.
#
# Shortening the review would only make that window smaller. Asking removes it: a review
# nobody requested never starts, and a review someone requested is not racing anything.
# [LAW:dataflow-not-control-flow] the trigger is the fix, not a tuning of the race.
name: AI Code Review

# issue_comment, because a pull request's comments ARE issue comments — there is no
# `pull_request_comment` event. It fires for every comment on every issue in the
# repository, so which of them is a review request is decided in the gate job below and
# nowhere else.
on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # THE GATE — the one place that decides whether a comment is a review request this
  # repository will honour, and the reason the privileged checkout below is safe.
  #
  # SECURITY POSTURE, stated in full because this trigger's posture is the opposite of
  # `pull_request`'s and the difference is easy to lose:
  #
  # `issue_comment` runs from the DEFAULT BRANCH with the repository's secrets in scope —
  # the same privileged position as `pull_request_target`, which the `pr-review` base
  # refuses for exactly this reason. Checking out a pull request's head in that position
  # is the untrusted-checkout pattern CodeQL flags as high: attacker-authored code on
  # disk in a job that holds credentials.
  #
  # This job is what makes the checkout sound, and it holds THREE conditions, all of
  # which must pass before the review job exists at all:
  #   1. someone this repository already has a standing relationship with asked —
  #      `author_association` is OWNER, MEMBER or COLLABORATOR — so a drive-by comment
  #      from a stranger cannot start a run. Read that as exactly what it says and no
  #      more: MEMBER is ORGANISATION membership and carries no permission on this
  #      repository, so in an org with open membership the set of people who can spend
  #      this repository's tokens is the org, not its writers. That is deliberate and it
  #      is the weaker of two available checks. The stronger one —
  #      `repos/{repo}/collaborators/{user}/permission`, demanding `admin` or `write` —
  #      is NOT taken because that endpoint requires push access to answer, so buying it
  #      would mean raising this workflow's `permissions:` to `contents: write`: a
  #      privileged, secret-holding job would gain the ability to write the repository in
  #      order to check who may ask it to read. That trade makes the posture worse than
  #      the exposure it closes, and if the token could not answer, `set -e` would fail
  #      the gate closed and no review would run at all. What this check is FOR is token
  #      spend; what protects the secrets is condition 2, which no association can
  #      satisfy. [FRAMING:representation] the claim is sized to the check;
  #   2. the head is in THIS repository, not a fork — so the code checked out beside the
  #      secrets is code that already had write access to this repo;
  #   3. the pull request is open.
  # A fork PR is therefore never checked out under this trigger. It is not reviewed at
  # all, which is a real and deliberate loss of capability, named here rather than
  # discovered: reviewing untrusted code from a privileged job is the vulnerability, and
  # no arrangement of this workflow makes it safe.
  #
  # This job runs NO checkout. Nothing from the pull request touches this runner — it
  # reads the API and emits three strings. That ordering is the whole design: the fork
  # decision is reached BEFORE any untrusted byte exists on disk. The action carries its
  # own `prIsFromFork` refusal too, but that one runs inside the action, after the
  # checkout, so it cannot be what protects the checkout. [LAW:single-enforcer] — this
  # gate is the enforcer for the trigger's posture; the action's is the enforcer for the
  # review's own eligibility, and they answer at different instants on purpose.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    # A STRUCTURAL prefilter, not a second copy of the trigger rule: `issue.pull_request`
    # is present only on comments that live on a pull request, which is a fact about the
    # event's shape rather than a judgement about its content. The `/review` command
    # itself is matched in exactly one place — the step below — so the phrase cannot drift
    # between a job condition and a script. The cost of that discipline is a few seconds
    # of runner time on ordinary PR comments, which is the right price for one enforcer.
    # [LAW:one-source-of-truth]
    if: github.event.issue.pull_request != null
    timeout-minutes: 5
    outputs:
      review: ${{ steps.gate.outputs.review }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
    steps:
      - name: Decide whether this comment requests a review
        id: gate
        # EVERY untrusted value arrives as an ENVIRONMENT VARIABLE, never interpolated
        # into the script body. A comment body is attacker-controlled text, and
        # `${{ github.event.comment.body }}` written inline is substituted before bash
        # parses the line — a comment containing a backtick or `$(...)` would execute on
        # this runner, in a job holding the repository's secrets. Through `env:` the value
        # is data the shell never parses. This is not defensive style; inline is a
        # vulnerability and this is the fix.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        # No `2>/dev/null`, no `|| true`, no defaulted value anywhere: `set -euo pipefail`
        # plus an explicit check after the one external call. A gate that fails open is a
        # gate that reviews a fork PR with secrets in scope, so every failure here must
        # stop the job rather than produce a plausible answer. [LAW:no-silent-failure]
        run: |
          set -euo pipefail

          # Not eligible is the DEFAULT, overwritten only by reaching the end. Every exit
          # path before that leaves `review=false` already written, so a path nobody
          # thought about cannot emit a permissive answer.
          echo "review=false" >> "$GITHUB_OUTPUT"

          # A REFUSAL HAS TWO AUDIENCES, and only one of them is always owed an answer.
          #
          # [LAW:single-enforcer] THE ONE WAY THIS JOB RECORDS A REFUSAL, so a new refusal
          # cannot ship reaching fewer sinks than the others — which had already happened: the
          # closed-PR path wrote a log warning while its two siblings also wrote a step summary.
          # This half is unconditional, because the repository's own record of why it declined
          # to spend money is owed on every path. [LAW:no-silent-failure]
          record_refusal() {
            echo "::warning title=Review not started::$1"
            {
              echo "### Review not started"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # THE ANSWER TO THE PERSON WHO ASKED — the record plus the sink that reaches them,
          # composed rather than duplicated. A run on `issue_comment` is attached to no commit,
          # so unlike a `pull_request` run it appears in NO check list on the pull request.
          # Recording only in the log and the step summary means a maintainer who types
          # `/review` on a fork PR sees the workflow go green and nothing whatsoever on the PR —
          # indistinguishable from this action not being installed, which is exactly the "asked
          # and got nothing" this base exists to end. They asked in a comment; they are answered
          # in a comment.
          #
          # Reached only AFTER the association check below, and that ordering is the security
          # property: see the comment on the check itself for why an unauthorized asker gets the
          # record and not the answer. [LAW:composability] the part is usable without the whole.
          #
          # No `|| true`: a refusal the asker cannot see is the failure being fixed here, so
          # failing to deliver it fails the job rather than passing quietly.
          # [LAW:no-silent-failure]
          refuse() {
            record_refusal "$1"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "**Review not started.** $1"
          }

          # THE COMMAND, matched once, here. A line whose first non-blank content is
          # `/review`, ending there or continuing after whitespace — so a `/review` quoted
          # mid-sentence or inside a URL does not start a billed run. `grep -q` exits 1 on
          # no match, which `set -e` would treat as a failure, so the match is consumed by
          # an `if` that distinguishes "no match" from "grep broke".
          #
          # A HERE-STRING, NOT A PIPE, and the difference is a real bug rather than taste.
          # `grep -q` stops at the first match, so `printf … | grep -q` leaves printf
          # writing into a closed pipe: for a body larger than the 64 KiB pipe buffer,
          # printf takes SIGPIPE and exits 141, and `set -o pipefail` promotes that to the
          # pipeline's status — so the `if` reads FALSE and a genuine request is silently
          # dropped. GitHub's comment limit is 65536 characters, which straddles that
          # buffer exactly, so the failing case is an ordinary long comment and not a
          # contrived one. A here-string is a file, not a pipe: nothing can take SIGPIPE
          # and the match is the only thing the status reports. [LAW:no-silent-failure]
          if grep -qE '^[[:space:]]*/review([[:space:]]|$)' <<< "$COMMENT_BODY"; then
            echo "Comment by @${COMMENT_AUTHOR} requests a review."
          else
            echo "Comment by @${COMMENT_AUTHOR} is not a /review request; nothing to do."
            exit 0
          fi

          # WHO may spend the repository's tokens — and that is the whole of what this
          # decides. A stranger's comment must not start a run that costs money. It is
          # NOT what keeps attacker code away from the secrets; the fork refusal below is,
          # and it holds no matter how the asker is associated. [LAW:single-enforcer]
          #
          # THIS REFUSAL IS RECORDED AND NOT ANSWERED, the one path that takes the part
          # instead of the whole, because a reply here is a reply to an UNTRUSTED party and
          # the trigger it rides on is unbounded. This job runs on every comment in the
          # repository by anyone who can leave one; answering each unauthorized `/review`
          # makes a stranger's comment spawn a bot comment, so one attacker turns a public
          # pull request into a maintainer-owned thread of refusals and fans a notification
          # out to every subscriber for each one. That is the same reasoning that already
          # keeps this gate silent on a comment that asked for nothing — an unbounded
          # external trigger must not be amplified into repository-authored noise — and it
          # costs nothing legitimate: a same-repository branch needs push access to exist,
          # so an asker who is neither owner, member, nor collaborator is a passer-by on
          # someone else's pull request, and a fork PR is refused below on its own terms.
          #
          # Nothing is hidden. The run log and the step summary carry the reason, the audience
          # for which is the repository rather than the passer-by. [LAW:no-silent-failure]
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              record_refusal "\`@${COMMENT_AUTHOR}\` asked for a review, but only a repository owner, member, or collaborator can start one (association: \`${AUTHOR_ASSOCIATION}\`)."
              exit 0
              ;;
          esac

          # The ONE external call, and the three facts it must yield. Compared by numeric
          # repository id rather than name, so a rename cannot read as a fork — the same
          # rule the action's own `prIsFromFork` applies, for the same reason.
          pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" \
            --jq '{state: .state, headSha: .head.sha, headRepoId: .head.repo.id, baseRepoId: .base.repo.id}')"

          # Validate before trusting: a jq path that stopped matching, or a head repository
          # that has been deleted, must stop the job — never resolve to an empty ref that
          # `actions/checkout` would interpret as the default branch.
          state="$(printf '%s' "$pr_json" | jq -re '.state')"
          head_sha="$(printf '%s' "$pr_json" | jq -re '.headSha')"
          # A DELETED HEAD REPOSITORY IS A FORK, not a broken response. GitHub returns
          # `head.repo: null` once the fork a pull request came from is deleted, so `jq -re`
          # exits 1 here and `set -e` kills the step — answering "this is an error, not a
          # refusal" for a state the action itself types as a real domain value: prIsFromFork
          # returns TRUE for an absent head repo, with a comment calling it exactly that.
          # Two maps of one meaning, disagreeing. A sentinel that can never equal a numeric
          # repository id routes it to the fork refusal one branch below, which is already
          # the right answer and the one the comment above claims parity with.
          # [LAW:one-source-of-truth]
          #
          # The other three keep `-re`: a missing state, head SHA, or BASE repository is a
          # malformed response carrying no meaning to recover — the same split prIsFromFork
          # draws when it throws on an absent base repo and returns true on an absent head.
          #
          # THE READ ORDER IS LOAD-BEARING, and it is what keeps this sentinel meaning exactly
          # one thing. `--jq` emits a null for a path that stopped matching just as it does for a
          # genuinely null field, so read alone this default could also absorb "the projection
          # broke" and answer a false "comes from a fork" for every same-repository PR. It cannot,
          # because `head_sha` is read with `-re` ABOVE: if `.head` were renamed or removed the
          # gate is already dead by the time this line runs. The sentinel is therefore reachable
          # only when `.head.sha` is present and `.head.repo` is null — which is the deleted-fork
          # state and nothing else. A test pins that ordering, because the property lives in the
          # sequence rather than in either line. [LAW:parse-dont-validate]
          head_repo_id="$(printf '%s' "$pr_json" | jq -r '.headRepoId // "deleted-head-repository"')"
          base_repo_id="$(printf '%s' "$pr_json" | jq -re '.baseRepoId')"

          if [ "$state" != "open" ]; then
            refuse "Pull request #${PR_NUMBER} is ${state}, not open, so there is nothing to review."
            exit 0
          fi

          # THE FORK REFUSAL, reached before any pull-request byte is on this runner.
          if [ "$head_repo_id" != "$base_repo_id" ]; then
            refuse "Pull request #${PR_NUMBER} comes from a fork. A comment-triggered review runs with this repository's secrets in scope, so it deliberately does not check out fork code."
            exit 0
          fi

          # Eligible. The head SHA is resolved HERE and handed to both the checkout and the
          # action, so the commit that is checked out and the commit the review is anchored
          # to are one value read twice, never two lookups that can disagree.
          # [LAW:one-source-of-truth]
          {
            echo "review=true"
            echo "pr-number=${PR_NUMBER}"
            echo "head-sha=${head_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Reviewing pull request #${PR_NUMBER} at ${head_sha}."

      # THE ERROR PATH ALSO HAS TO REACH THE PERSON WHO ASKED. The step above fails closed by
      # design — `set -euo pipefail` plus `jq -re`, so a broken `gh` call or a response missing
      # a field it must have stops it rather than guessing — but failing closed inside a job
      # attached to no commit is failing INVISIBLY: the run appears in the Actions tab and on no
      # check list this pull request shows. Without this step a maintainer types `/review`, the
      # gate dies on a transient API fault, and they wait for a review that will never come with
      # nothing anywhere to tell them so.
      #
      # THE CONDITION IS THE REVIEW JOB'S TWIN, WORD FOR WORD, and it has to be. `failure()` is
      # FALSE when a job is CANCELLED, and this job carries `timeout-minutes: 5` — so a gate
      # whose single `gh api` call hangs on a congested host is cancelled rather than failed, and
      # under `failure()` the asker is told nothing. That is the identical silent death the
      # review job's step exists to close, one job earlier, and one concern may not be enforced
      # by two conditions that disagree about what counts as not answering.
      # [LAW:single-enforcer]
      #
      # `always()` ALONE would be wrong, and it is NOT this condition: it would speak over the
      # two paths that owe the asker nothing — a comment that was not a request, and a request
      # from someone with no standing to make one. Both of those `exit 0` inside the step above,
      # so both leave `steps.gate.outcome` equal to 'success', and success is the single outcome
      # this stays silent on. The deliberate silence is kept by reading the step's own outcome,
      # not by narrowing which events may speak — the answer follows the value the step
      # produced. [LAW:dataflow-not-control-flow] [LAW:no-silent-failure]
      - name: Say so on the pull request if the gate could not decide
        if: always() && steps.gate.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "**Review not started.** The gate that decides whether to review this pull request stopped before it could reach a verdict, so no review ran and nothing was spent. This is an error, not a refusal — see the [run log](${RUN_URL}). Commenting \`/review\` again re-runs it."

  review:
    name: Review
    needs: gate
    # The gate's verdict, and the only thing that starts a review. A string compare
    # because job outputs are strings; `needs.gate.outputs.review` is `'true'` on exactly
    # the one path that wrote it.
    if: needs.gate.outputs.review == 'true'
    # One review at a time per pull request, and a review already in flight is NEVER
    # killed by the next one — `cancel-in-progress` is false, deliberately.
    #
    # This is the opposite choice from the `pr-review` base, for a reason that inverts
    # with the trigger. There, a new push made the in-flight review's SHA stale, so
    # cancelling it discarded work that had already lost its value. Here every run was
    # explicitly asked for, so cancelling one throws away a review a human is waiting on
    # AND the tokens it spent — the exact failure this base exists to end.
    #
    # WHY THIS SITS ON THE JOB AND NOT ON THE WORKFLOW, which is not a style choice and
    # was a real defect when it sat above: GitHub's concurrency rule has two halves and
    # `cancel-in-progress` governs only one of them. A run joining a group that is busy
    # goes PENDING — and "any previously pending run in the group is canceled",
    # unconditionally, whatever `cancel-in-progress` says. At workflow level the group's
    # members were ALL comments on the pull request, so an ordinary "looks good to me"
    # landing while a review ran would evict a colleague's queued `/review` and it would
    # simply never happen. Here the group's members are REVIEWS: a comment that is not a
    # request is skipped by the `if:` above, so it never joins the group and can evict
    # nothing. [LAW:decomposition] the group's boundary falls on "is this a review",
    # which is the thing it was always meant to mean.
    #
    # What remains, stated rather than glossed: a THIRD `/review` arriving while a second
    # is still queued does evict the second. That is the intended depth — the evicted run
    # had not started, so it spent nothing, and the run that survives reviews the same or
    # newer code. The loss this base exists to prevent is a run that BILLED and delivered
    # nothing, and no path here does that. [LAW:no-silent-failure]
    concurrency:
      group: code-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Cap a hung review (network stall, API retry loop) instead of letting it hold a
    # runner for GitHub's 6-hour default. Reviews finish in ~2-4 min typically, but API
    # congestion has stretched successful runs to 11-15 min (observed 2026-08: two runs
    # were killed at a 15-min cap and passed on rerun), so the cap sits well above that
    # tail.
    timeout-minutes: 30
    steps:
      - name: Checkout pull request
        # SHA-pinned, unlike the review action below — a deliberately DIFFERENT posture
        # for a DIFFERENT risk, not an inconsistency to tidy up. checkout is THIRD-PARTY
        # code fetched over the network on every run, and it runs in a job that holds this
        # repository's secrets. Under a moving tag, a future compromised release would
        # execute automatically, unreviewed, on every review request.
        #
        # The moving-tag argument that governs the review action does not transfer here:
        # it rests on the ref pointing at a repo we author, review, and release — a
        # relationship no third party has with us. So this pin accepts exactly the
        # re-bump cost that argument avoids, because the code being fetched is not ours.
        # [LAW:one-type-per-behavior] Two different trust relationships, two rules.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The SHA the gate resolved, not a branch name: a ref resolved again here could
          # move between the gate's fork decision and this checkout, which would make the
          # decision apply to a different commit than the one that lands on disk.
          ref: ${{ needs.gate.outputs.head-sha }}
          # The gate has established that this head is in THIS repository, so the tree is
          # not attacker-authored — and `persist-credentials` stays off anyway. The
          # default (true) writes GITHUB_TOKEN into .git/config inside the tree, where
          # anything later executing out of the checkout can read a credential it was
          # never handed; its scope here is issues+PR write, broader than the
          # contents:read the checkout needs. Nothing in this job pushes or fetches over
          # authenticated git — the review reads the diff through the API with the
          # GITHUB_TOKEN input, and DEPENDENCY_DIFF uses the compare API — so persisting
          # it buys nothing. Defence in depth behind a gate, not instead of one.
          persist-credentials: false

      # Pinned to the action's moving major tag on purpose: this repo tracks its latest
      # release with no edit here, ever. Pinning a SHA instead would mean a PR against
      # every consuming repo for every release, which in practice means none of them get
      # updated. The version appears on the `uses:` line and nowhere else — under a
      # moving tag a version LABEL beside it is a map that begins lying at the next
      # release. [FRAMING:representation]
      #
      # Every credential the installer provisions is passed, under its own name. PROVIDER
      # defaults to `auto`, which the action retargets centrally; a workflow carrying only
      # the then-current target's secret breaks the day it moves, so declare in
      # `secrets:` whatever `auto` may resolve to. The action fails loudly, before
      # spending anything, if the credential it needs is missing.
      #
      # PR_NUMBER and HEAD_SHA are REQUIRED under this trigger. An `issue_comment` payload
      # carries no `pull_request` object, so the action's zero-config detection has nothing
      # to read; `resolveReviewTarget` takes these explicit inputs instead. They are the
      # gate's outputs, so the review is anchored to the same commit the checkout placed
      # on disk.
      #
      # They reach the workflow from the configuration's inputs table, like every other
      # input — so IN THIS BASE the block below does not name them, and in a RENDERED
      # workflow it does. If you are reading the rendered file, the two extra keys above
      # came from the binding, not from here, and this paragraph came along with the rest
      # of the base.
      #
      # Why the base must not name them, which is a live constraint and not a preference:
      # a key this block lists PINS ITS POSITION in the output (the emitter carries the
      # base's key order), while the rebinding decides which key comes LAST. List them and
      # the two orders disagree, this comment gets anchored to a key that is no longer
      # last, and it is emitted INSIDE the `with:` block — then dropped entirely on the
      # next render, because a rendered file must be a fixed point and that one is not.
      # Keeping this block to the two keys `pr-review` names is what keeps the orders
      # agreeing. [LAW:one-source-of-truth]
      - name: Code Review
        id: review
        uses: promptctl/copirate-code-review-agent@v1
        with:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEPENDENCY_DIFF: 'true'

      # The transcript is the only artifact that can explain a review that failed, hung,
      # or misbehaved — the exact prompt, the raw engine output including thinking and
      # tool calls, and stderr, for every attempt. action.yml produces it on EVERY
      # termination path and documents this exact consumption; a template that never
      # consumed it left every consumer with a failed run and nothing to read.
      # [LAW:no-silent-failure]
      #
      # `if: always()` because the run that most needs a transcript is the one that
      # failed. The output guard covers the paths that legitimately spawn no engine,
      # where the directory is empty rather than missing.
      #
      # `continue-on-error` because this job's CONCLUSION is the signal a consumer reads
      # to tell "the review found nothing" from "the review never ran" — those two are
      # otherwise identical downstream, since both surface as zero findings. An artifact
      # outage, a quota trip, or a transcript too large would otherwise flip a review
      # that succeeded and posted its comments into a reported failure, which reads as
      # the second case and sends a maintainer hunting a review that already worked. The
      # archival failure stays loud in this step's own log; it just stops speaking for
      # the review. [LAW:no-silent-failure] applies to the archival error, not to the
      # status check it would otherwise corrupt.
      - name: Archive review transcript
        if: always() && steps.review.outputs.transcript-dir != ''
        continue-on-error: true
        # SHA-pinned for the same reason as the checkout above: third-party code fetched
        # over the network on every run, so it does not inherit the moving-tag argument
        # that governs our own action.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-session-transcript
          path: ${{ steps.review.outputs.transcript-dir }}
          if-no-files-found: ignore

      # THE REVIEW JOB OWES THE SAME ANSWER THE GATE DOES, and for the same reason — this
      # is the gate's answering step mirrored onto the job that spends the money, carrying the
      # same condition because "did not answer" is one idea. [LAW:single-enforcer]
      #
      # Under `pull_request` a dead review was at least VISIBLE: the run attached to the
      # head commit and a red check appeared on the pull request. An `issue_comment` run is
      # attached to no commit and appears in NO check list, so without this step every way
      # this job can die is completely silent — an expired credential, a runner fault, a
      # failed checkout, the job's own timeout, or the action crashing before it can post.
      # The asker sees a comment they typed and then nothing, forever, which is
      # indistinguishable from this action not being installed. That is the exact failure
      # this base exists to end, and moving the trigger re-opened it one job over.
      # [LAW:no-silent-failure]
      #
      # ONE DEATH THIS CANNOT ANSWER, named here so the coverage is not read as total. A job
      # cancelled while still QUEUED executes no steps at all — `always()` included, because
      # `always()` is a condition a runner evaluates and no runner ever took the job. Nothing
      # inside such a run can speak for it. The concurrency note above describes exactly that
      # path: a third `/review` evicts a still-pending second run, unconditionally. The answer
      # there would have to come from the run that CAUSED the eviction, since it is the only one
      # still alive to speak, which is a different design and not this step's job. What this step
      # covers is every death of a job that STARTED.
      #
      # `always() && steps.review.outcome != 'success'` rather than `failure()`, because
      # `failure()` misses the two cases that matter most here. A job CANCELLED by its own
      # `timeout-minutes` is not a failure, and that is precisely the "burned the budget and
      # posted nothing" outcome a human most needs told about. And a failure in an EARLIER
      # step leaves this one's `failure()` true but `steps.review.outcome` equal to
      # 'skipped' — which this condition still catches, while naming the review step as the
      # thing that did not succeed. Success is the only outcome that says nothing, because
      # on that path the review itself has already spoken. [LAW:dataflow-not-control-flow]
      #
      # The outcome is read rather than the event, which is what lets ONE condition serve both
      # jobs: each names its own decisive step, and every non-success value of it — including
      # the empty string, when the job died before that step was ever reached — is a run that
      # owes an answer.
      #
      # IT ASSERTS NEITHER A COST NOR A DELIVERY, and the second half of that was learned the
      # hard way. The gate's twin can promise "nothing was spent" truthfully, because it refuses
      # before any engine starts; by here a review may have run for twenty minutes before dying.
      #
      # A FAILED STEP DOES NOT MEAN NO REVIEW WAS POSTED. Two paths in the action deliver and
      # then fail: the round-cap path posts its `NOT REVIEWED` notice and afterwards
      # `core.setFailed`s if a stale blocking review cannot be dismissed, and `landedDespite` in
      # src/run.js deliberately SWALLOWS a post error once it has confirmed the review is on the
      # pull request — after which the ledger append can still throw. On both, a notice saying
      # "no review was delivered" would sit directly beneath the review that was.
      #
      # So this step asserts only what it holds: one outcome string. Everything else — was a
      # review posted, was anything spent — is named as unknown and pointed at the log. A notice
      # that overstates its knowledge is worse than terse; it contradicts the artifact above it.
      # [FRAMING:representation] the claim is sized to the check.
      - name: Say so on the pull request if the review could not be delivered
        if: always() && steps.review.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr-number }}
          OUTCOME: ${{ steps.review.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # `steps.review.outcome` IS THE EMPTY STRING, not a state name, when the job died
          # before that step was ever reached — cancelled during `actions/checkout`, or a runner
          # fault. The condition above deliberately treats empty as non-success, so this step
          # runs on exactly that path and must not render it as empty backticks naming nothing.
          # A notice that cannot say what happened is the silence this step exists to end
          # wearing a comment's clothes. [LAW:no-silent-failure]
          if [ -n "${OUTCOME:-}" ]; then
            what="The review step ended \`${OUTCOME}\`."
          else
            what="The run ended before the review step started."
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "**This review run did not end cleanly.** ${what} A review may or may not have been posted: if one stands above this notice then it is real, and this notice is about the RUN rather than the review. The cause, and whether any tokens were spent, is in the [run log](${RUN_URL}). Commenting \`/review\` again starts a new one."

