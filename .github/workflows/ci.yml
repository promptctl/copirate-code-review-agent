name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The price table goes stale by the calendar, not by anyone touching the repo — that is the whole
  # shape of the failure it guards. A quiet day must still be able to red, so the checks run daily as
  # well as on every change; a failed scheduled run mails the repo owner, which is a human seeing it
  # without going looking. Without this trigger a repo nobody touched for a month would be silent
  # about a table that had been wrong for a month. [LAW:no-silent-failure]
  #
  # DAILY rather than weekly, and the cadence is load-bearing: the age threshold is evaluated only when
  # the check runs, so the real silent-drift bound is the threshold PLUS the gap between runs. At 30
  # days and a weekly cron that is up to 37 — precisely the interval that already burned us (DeepSeek
  # repriced 37 days after the last verification), so the backstop would have reproduced the worst case
  # it exists to bound. A daily gap keeps the true bound at 31.
  schedule:
    - cron: '17 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Assert README inputs tables match their action.yml
        # An action.yml is the source of truth for its input contract; the matching README
        # inputs table is a derived view (and the Marketplace listing body). Fail if they
        # drift — an undocumented input or an orphan row. kx9.7 reconciled them by hand;
        # this keeps them reconciled by construction. [LAW:single-enforcer][LAW:one-source-of-truth]
        # EVERY shipped action is checked; the pair list lives in the script, so a third
        # action is a data row there and never a second step here.
        run: node scripts/check-readme-inputs.js

      - name: Build
        run: npm run build

      - name: Assert bundles are up to date
        # Fail if a committed bundle doesn't match a fresh build. A stale bundle means the
        # shipped code doesn't reflect src/ changes — and the runner executes the bundle,
        # never src/, so a stale one ships silently. EVERY output of `npm run build` is
        # checked, not just the first: `build` emits two bundles (the review action's dist/
        # and dismiss-block/dist/), and a gate covering a subset of its output leaves the
        # rest to ship stale with CI green. [LAW:no-silent-failure]
        run: |
          if ! git diff --exit-code dist/ dismiss-block/dist/; then
            echo "a bundle is stale — run 'npm run build' and commit dist/ and dismiss-block/dist/ alongside src/ changes"
            exit 1
          fi

      - name: Test
        run: npm test

  installer:
    # Its OWN job, and not a step in `test`: the installer is a Python package with its
    # own toolchain, its own lockfile and its own failure modes, so a red check named
    # `installer` says which half of the repo broke before anyone opens a log — the same
    # reason `price-freshness` stands apart. It needs no npm and no bundle, so it costs
    # seconds.
    #
    # This is the thing that writes every consumer's workflow and provisions their
    # secrets. Without a job here its suite runs only when someone remembers to, and a
    # regression in it merges green. A count of the tests is deliberately not written
    # here: it would be a second, stale copy of something the run already reports.
    # [LAW:no-silent-failure] [LAW:one-source-of-truth]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: installer/uv.lock

      - name: Assert the lockfile matches pyproject.toml
        # The committed uv.lock is what `--frozen` installs from, here and on every
        # developer's machine. A lockfile that no longer agrees with its pyproject means
        # the two disagree about what this package depends on, and the one that wins is
        # whichever command someone happened to run. [LAW:one-source-of-truth]
        run: uv lock --check

      - name: Test
        # `--frozen` so the run is the lockfile's, not whatever resolves today: a suite
        # that silently upgrades its own dependencies is not a regression test.
        run: uv run --frozen pytest

  price-freshness:
    # Its OWN job, not a step in `test`: this fails for a reason that has nothing to do with whether
    # the code works — the rates were copied by hand off a vendor page and nobody has re-read that page
    # lately — and a distinctly-named red check says so before anyone opens a log. It needs no deps
    # and no build, so it costs seconds. [LAW:no-silent-failure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require the price table to have been verified recently
        run: node scripts/check-price-freshness.js

  version-bump:
    # Enforce the version-bump rule only where there is a base to diff against:
    # a pull request. On a push to main there is no "PR base"; the rule has already
    # been enforced on the PR that produced the merge. [LAW:dataflow-not-control-flow]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so the base branch and the merge base are reachable for
          # the diff in check-version-bump.sh.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Require a version bump when the shipped surface changed
        run: scripts/check-version-bump.sh "origin/${{ github.base_ref }}"
