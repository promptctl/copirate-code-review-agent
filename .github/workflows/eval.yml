name: Eval

# THE QUALITY GATE, DELIVERED (copirate-eval-harness-2fk.6): run eval/compare.js — replay the frozen
# golden suite against this checkout's src/ and verdict it against the committed baseline — where
# reviewers look: a check that reds on DEGRADED, with the verdict table in the run's Step Summary.
#
# EVERY RUN SPENDS REAL PROVIDER CREDITS — compare.js prints the exact estimate (the baseline's own
# recorded $/full-run × N) before spending; that print is the one authoritative figure, so no dollar
# amount is repeated here to drift from it. This is why there is NO unconditional per-PR trigger and
# never will be.
#
# The ticket sketched dispatch inputs for a cases filter and an N override. They are deliberately
# absent: compare.js derives N and the case set FROM the baseline and refuses any deviation — a
# candidate at a different N or over a subset measures a different population than the gate floor
# was computed from ([LAW:no-silent-failure], enforced in compareVerdict). Inputs the gate would
# reject are not inputs. [LAW:no-mode-explosion]

# UNDER MORATORIUM (zai-eval-harness-5ux). The pull_request trigger is DELETED, not disabled: while
# the suite cannot finish inside 45 minutes, a path that spends it by attaching a label is a path that
# spends it by accident. workflow_dispatch remains so the refusal below is reachable and legible —
# pressing the button now buys a fast, loud explanation instead of a suite.
#
# RESTORE THIS BLOCK WITH THE MORATORIUM, NOT BEFORE, and restore its reasoning with it: 'labeled' must
# be in the types set (attaching the label to an already-open PR has to buy the run; without it a label
# added after opening does nothing until the next push), and the job's `if:` must re-gate on all three
# of — the PR being from THIS repo (GitHub withholds secrets from fork pull_request events, so a fork
# run could only burn setup time before failing on empty credentials in a way that reads like a
# misconfigured secret), the PR wearing the 'eval' label, and a 'labeled' event naming 'eval' itself
# (otherwise attaching any unrelated label to an eval-labeled PR silently re-spends the whole suite).
# [LAW:no-silent-failure]
on:
  workflow_dispatch:

permissions:
  contents: read

# Two suite runs interleaved would race their provider rate-limits and double-spend to answer one
# question. One group for the whole workflow: at most one run in flight, later triggers queue (and
# GitHub keeps only the newest pending run per group, which is the right economy for a paid suite).
concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    # Derived from the suite, not the platform: N=5 × 4 cases is 20 replays, spread level-by-level over
    # the THREE credential lanes below, so a lane carries at most 7. The pinned engine
    # (claude-subscription/claude-sonnet-5) runs 13–27 min per replay — measured over the 20 replays of
    # the 2026-09-06 baseline freeze, see eval/README.md. The worst lane is not 7 × 27: freeze-suite.js
    # kills a replay that stalls (a throttled CLI sits in silent retry) at its 120-minute deadline and
    # hands the job to another lane. A lane that dies outright (its account at the daily wall, which PR
    # reviews on the same accounts can bring on) fails every job instantly and the survivors split its
    # share: 10 each if it was dead from the start. 350 is the most a hosted job can carry under its
    # 6-hour ceiling, and by this model it fits three healthy lanes with one stall (6 × 27 + 120 ≈ 282)
    # or one dead lane with no stall (10 × 27 = 270), each plus setup and a few minutes of judge calls.
    # A dead lane AND a stall (9 × 27 + 120 ≈ 363), two dead lanes, or two stalls on one lane do not
    # fit and are read as below. The serial single-lane shape this replaced needed 260–540 min before
    # any stall.
    #
    # A run that exceeds this is killed mid-suite: real quota spent, no verdict written, and the job
    # reads as infrastructure failure rather than as a gate that could not finish. A timed-out gate must
    # be read as "not measured", never as "not degraded". [LAW:no-silent-failure]
    timeout-minutes: 350
    steps:
      # THE MORATORIUM, ENFORCED WHERE THE SPEND HAPPENS (zai-eval-harness-5ux). This is the FIRST step
      # and it fails, so no checkout, no credentials, and no replay can run beneath it. It is a failing
      # step rather than a false `if:` on purpose: a skipped job renders as "did not need to run", which
      # is the opposite of what this means, and the operator who pressed the button would learn nothing.
      # A ban that reads as a green skip is a ban nobody obeys. [LAW:no-silent-failure]
      #
      # There is deliberately NO override input. An input would be a mode whose only user is somebody
      # arguing themselves past the ban, which is exactly the failure this exists to stop
      # ([LAW:no-mode-explosion]). Lifting the moratorium means deleting this step in the same change
      # that makes the suite fit its budget — a commit, reviewed, not a checkbox at dispatch time.
      - name: Refuse to run — the eval gate is under moratorium
        run: |
          cat >&2 <<'MORATORIUM'
          ============================================================================
          THE EVAL GATE IS UNDER MORATORIUM. This run spent nothing and measured nothing.
          ============================================================================
          Owner, 2026-09-08: an eval that takes 5 hours is not useful.

          The suite as it stands is N=5 x 4 cases = 20 replays at 13-27 min each, spread
          over three subscription lanes, so a full gate run takes 1.5-3.5 hours and has
          been observed to take longer and wall before finishing. The requirement is
          UNDER 45 MINUTES.

          Arithmetic, so nobody re-derives it hopefully: wall clock is
          ceil(replays / lanes) x per-replay. Four accounts exist in the pool. Under 45
          minutes needs depth 1, which means replays <= lanes, which means at most four
          replays. The full N=5 suite therefore CANNOT fit the budget on these accounts,
          and adding lanes does not change that. Fewer replays in the common case is the
          only shape that does.

          Do NOT re-enable this workflow to "just get one number". A run costs about a
          day of one account's quota and competes with PR reviews on the same pool. Its
          dollar figure is NOTIONAL, not billed — the pinned engine is a subscription and
          baseline.json records costPerFullRunUsd: null. Quota and wall clock are the
          real currency.

          The redesign, its measured levers, and the acceptance that lifts this ban are
          in ticket zai-eval-harness-5ux. Delete this step as part of THAT change.
          MORATORIUM
          exit 1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history, not the fetch-depth:1 default: compare.js resolves the newest committed
          # baseline by commit-graph order, and with more than one baseline committed (there are two)
          # a shallow clone collapses that ranking to a tie it refuses (exit 2). Verified empirically
          # in 2fk.5. On a pull_request this checks out the PR merge ref — the candidate under gate
          # is the PR as it would land, which is the thing the check protects.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Restore this commit's partial suite from an earlier gate run
        # A gate that walls (a lane's account at its daily or weekly limit) or times out leaves completed
        # replays that were real quota spent; with a fresh workspace per job they were spent for nothing,
        # and the next dispatch started from zero into the same wall. The candidate root is carried across
        # runs instead, keyed by the commit under gate: compare.js accepts the runs under it that carry
        # THIS commit's identity (each run's meta.json records the tree that produced it — commit plus
        # dirty flag — and only a clean tree's identity can match) and refuses any that do not, and
        # freeze-suite.js's census then replays only the deficit. A different
        # commit — a push to the PR, a merge to main — matches nothing and starts fresh, which is what a
        # different candidate should do. The key ends in the run id so every run saves its own entry and
        # the prefix restore picks the newest, i.e. the most complete. [LAW:one-source-of-truth]
        # Three paths travel together: the candidate root (the census), the lane logs beside it (why the
        # earlier run walled — a resumed run's artifact carries the whole suite's evidence), and the judge's
        # content-keyed decision cache, so re-scoring the inherited runs consults no judge again.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            eval/out/candidate-ci
            eval/out/candidate-ci-logs
            eval/out/.judge-cache.json
          key: eval-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: eval-candidate-${{ github.sha }}-

      - name: Gate the candidate against the frozen baseline
        env:
          # THE LANES. One subscription account per lane; freeze-suite.js (which compare.js replays
          # through) puts each lane's value in the slot the pinned provider reads, so the pinned engine's
          # own input var (CLAUDE_CODE_OAUTH_TOKEN, the one PROVIDER=auto resolves to) is never read here
          # and is deliberately absent. Each secret is the same-named item in the maintainer's keychain —
          # the pool the review action's installer also draws from — so a lane's log names its account.
          # The suite needs about a day of ONE account's quota; three lanes make it fit a job and share
          # the spend. Re-freezing the baseline onto a metered provider means re-pointing this roster at
          # that provider's keys (one per lane), not just changing data under eval/.
          CLAUDE_CODE_OAUTH_TOKEN_SSSSSMOKEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SSSSSMOKEY }}
          CLAUDE_CODE_OAUTH_TOKEN_SIGNUP: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SIGNUP }}
          CLAUDE_CODE_OAUTH_TOKEN_BRANDROID: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_BRANDROID }}
          # The judge's own credential, required unconditionally for the default llm matcher whatever
          # the cases pin (score.js). Separate from the engine's on purpose: a subscription OAuth token
          # authenticates the review CLI, not the raw Messages call the judge makes.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # A fixed --out (not compare.js's timestamped default) so the restore above, the save below, and
        # the summary and artifact steps all address one path without plumbing an output between steps.
        # --credentials names the lane env vars above, in the roster's order.
        run: >-
          node eval/compare.js --out eval/out/candidate-ci
          --credentials CLAUDE_CODE_OAUTH_TOKEN_SSSSSMOKEY,CLAUDE_CODE_OAUTH_TOKEN_SIGNUP,CLAUDE_CODE_OAUTH_TOKEN_BRANDROID

      - name: Save this commit's suite for the next gate run
        # always(): the partial suite of a walled or timed-out run is exactly what the next dispatch must
        # inherit. A run that aborted before its first replay has no root to save; the action reports
        # that as a warning, which is the honest reading — nothing was spent, nothing is kept.
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            eval/out/candidate-ci
            eval/out/candidate-ci-logs
            eval/out/.judge-cache.json
          key: eval-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish the verdict to the Step Summary
        # always(): a DEGRADED gate exits 1 but has already written verdict.md — the red run's
        # summary is exactly the one reviewers most need to see. When no verdict.md was written
        # (incomparable baseline, replay failure, a refusal upstream), say so loudly instead of
        # publishing an empty summary. The fallback names no step: which one stopped the run varies,
        # and a message that guesses sends the reader to an empty log. [LAW:no-silent-failure]
        if: always()
        run: >-
          cat eval/out/candidate-ci/verdict.md >> "$GITHUB_STEP_SUMMARY" ||
          echo '**No verdict was produced** — the run stopped before comparing; see the log of the step that failed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate artifacts
        # always(): the artifacts of a DEGRADED or aborted run (per-run findings, scorecards,
        # engine transcripts, verdict.{md,json}, and the per-replay lane logs freeze-suite.js writes to
        # the SIBLING candidate-ci-logs/ — a walled lane shows up there, not under the root) are the
        # evidence for diagnosing it.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval-candidate
          path: |
            eval/out/candidate-ci
            eval/out/candidate-ci-logs
          # An abort before the first replay legitimately leaves nothing to upload; the summary
          # step above already reported that state, so an empty upload warns rather than double-fails.
          if-no-files-found: warn
